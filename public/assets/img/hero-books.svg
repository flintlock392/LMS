<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-label="A stack of books with an open book in front">
  <defs>
    <symbol id="paw" viewBox="0 0 20 20">
      <ellipse cx="10" cy="13" rx="5" ry="4"/>
      <circle cx="4" cy="7" r="2"/><circle cx="8" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="16" cy="7" r="2"/>
    </symbol>
  </defs>

  <!-- shadow -->
  <ellipse cx="230" cy="312" rx="190" ry="22" fill="#2E1C17" opacity=".55"/>

  <!-- book 4 (bottom, maroon) -->
  <g transform="translate(150 222)">
    <rect x="10" y="6" width="236" height="52" rx="6" fill="#F4E3C3"/>
    <path d="M10 52 h236" stroke="#D9C29A" stroke-width="2"/><path d="M10 40 h236 M10 28 h236 M10 16 h236" stroke="#E6D2AE" stroke-width="1.5"/>
    <rect x="0" y="0" width="64" height="62" rx="8" fill="#8E3B45"/>
    <rect x="0" y="0" width="250" height="10" rx="5" fill="#7A2F39"/>
    <rect x="0" y="54" width="250" height="10" rx="5" fill="#7A2F39"/>
    <path d="M10 14 v36 M54 14 v36" stroke="#D8B56E" stroke-width="2"/>
    <use href="#paw" x="22" y="22" width="20" height="20" fill="#E3C27A"/>
  </g>

  <!-- book 3 (blue) -->
  <g transform="translate(160 166)">
    <rect x="10" y="6" width="216" height="48" rx="6" fill="#F4E3C3"/>
    <path d="M10 38 h216 M10 26 h216 M10 14 h216" stroke="#E6D2AE" stroke-width="1.5"/>
    <rect x="0" y="0" width="60" height="58" rx="8" fill="#4C6488"/>
    <rect x="0" y="0" width="232" height="9" rx="4.5" fill="#3F5677"/>
    <rect x="0" y="50" width="232" height="9" rx="4.5" fill="#3F5677"/>
    <path d="M10 13 v32 M50 13 v32" stroke="#D8B56E" stroke-width="2"/>
    <path d="M20 40 q10 -24 20 -16 q-8 2 -10 10 q6 -6 12 -2" fill="none" stroke="#D8B56E" stroke-width="2"/>
  </g>

  <!-- book 2 (brown) -->
  <g transform="translate(150 112)">
    <rect x="10" y="6" width="226" height="48" rx="6" fill="#F4E3C3"/>
    <path d="M10 38 h226 M10 26 h226 M10 14 h226" stroke="#E6D2AE" stroke-width="1.5"/>
    <rect x="0" y="0" width="62" height="58" rx="8" fill="#9A5530"/>
    <rect x="0" y="0" width="242" height="9" rx="4.5" fill="#864624"/>
    <rect x="0" y="50" width="242" height="9" rx="4.5" fill="#864624"/>
    <path d="M10 13 v32 M52 13 v32" stroke="#E3C27A" stroke-width="2"/>
    <use href="#paw" x="21" y="19" width="20" height="20" fill="#E3C27A"/>
  </g>

  <!-- book 1 (top, green) -->
  <g transform="translate(166 56)">
    <rect x="10" y="6" width="206" height="48" rx="6" fill="#F4E3C3"/>
    <path d="M10 38 h206 M10 26 h206 M10 14 h206" stroke="#E6D2AE" stroke-width="1.5"/>
    <rect x="0" y="0" width="60" height="58" rx="8" fill="#6E7D4E"/>
    <rect x="0" y="0" width="222" height="9" rx="4.5" fill="#5C6A40"/>
    <rect x="0" y="50" width="222" height="9" rx="4.5" fill="#5C6A40"/>
    <path d="M10 13 v32 M50 13 v32" stroke="#D8B56E" stroke-width="2"/>
    <use href="#paw" x="20" y="19" width="20" height="20" fill="#E3C27A"/>
  </g>

  <!-- open book in front -->
  <g transform="translate(20 168)">
    <path d="M150 150 L150 30 Q90 0 6 22 L6 140 Q90 120 150 150 Z" fill="#F1DDB6"/>
    <path d="M150 150 L150 30 Q210 0 294 22 L294 140 Q210 120 150 150 Z" fill="#F6E7C8"/>
    <path d="M150 30 Q96 6 22 26 M150 46 Q96 22 22 42 M150 62 Q96 38 22 58" fill="none" stroke="#DEC497" stroke-width="2"/>
    <path d="M150 30 Q204 6 278 26 M150 46 Q204 22 278 42 M150 62 Q204 38 278 58" fill="none" stroke="#E6D0A6" stroke-width="2"/>
    <path d="M150 150 L150 30" stroke="#C9A877" stroke-width="3"/>
    <path d="M6 140 Q90 120 150 150 Q210 120 294 140 L294 150 Q210 132 150 160 Q90 132 6 150 Z" fill="#8E3B45"/>
    <!-- ribbon -->
    <path d="M150 150 L138 196 L150 186 L162 196 Z" fill="#8E3B45"/>
  </g>
</svg>
